name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # every night
  workflow_dispatch:      # run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb95e&color_dots=#1b1733,#3b2252,#5c2a5e,#c2607e,#f1a463
            dist/snake-light.svg?color_snake=#5c2a5e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
